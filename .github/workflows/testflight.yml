name: TestFlight Upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store version for this upload
        required: true
        default: "1.0.1"
      build_number:
        description: Build number. Defaults to the GitHub run number when blank.
        required: false
      export_only:
        description: Export a signed IPA artifact without uploading it to TestFlight
        type: boolean
        default: false
      status_only:
        description: Check App Store versions and build processing without building or uploading
        type: boolean
        default: false
      prepare_store_version:
        description: Prepare only the verified 1.0.3 build 35 App Store draft, without submitting for review
        type: boolean
        default: false
      submit_store_version:
        description: Submit only the prepared 1.0.3 build 35 for App Review, releasing after approval
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release ref and build number
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      build_number: ${{ steps.release.outputs.build_number }}
    steps:
      - name: Check main and resolve the build number
        id: release
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != refs/heads/main || "${GITHUB_REF_PROTECTED:-}" != true ]]; then
            echo "::error::TestFlight releases must run from protected main."
            exit 1
          fi

          BUILD_NUMBER="${BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]*[1-9][0-9]*$ ]]; then
            echo "::error::The build number must be a positive decimal integer."
            exit 1
          fi

          printf 'build_number=%s\n' "$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  status:
    name: Check App Store processing
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.ref_protected &&
          inputs.status_only && !inputs.prepare_store_version && !inputs.submit_store_version }}
    needs: validate
    runs-on: ubuntu-latest
    environment: testflight-release
    steps:
      - uses: actions/checkout@v4
      - name: Read release status
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: node scripts/app-store-status.mjs

  prepare-store:
    name: Prepare migration App Store draft
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.ref_protected &&
          inputs.prepare_store_version && !inputs.status_only && !inputs.submit_store_version }}
    needs: validate
    runs-on: ubuntu-latest
    environment: testflight-release
    steps:
      - uses: actions/checkout@v4
      - name: Test App Store release scripts
        run: node --test scripts/test-app-store-release.mjs
      - name: Prepare verified build and release notes
        env:
          APP_VERSION: ${{ inputs.version }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: node scripts/prepare-app-store-migration.mjs

  submit-store:
    name: Submit migration for App Review
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.ref_protected &&
          inputs.submit_store_version && !inputs.status_only && !inputs.prepare_store_version }}
    needs: validate
    runs-on: ubuntu-latest
    environment: testflight-release
    steps:
      - uses: actions/checkout@v4
      - name: Test App Store release scripts
        run: node --test scripts/test-app-store-release.mjs
      - name: Submit only the prepared migration
        env:
          APP_VERSION: ${{ inputs.version }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: node scripts/submit-app-store-migration.mjs

  upload:
    name: Test and prepare TestFlight build
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.ref_protected &&
          !inputs.status_only && !inputs.prepare_store_version && !inputs.submit_store_version }}
    needs: validate
    runs-on: macos-26
    environment: testflight-release
    timeout-minutes: 60

    env:
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
      TEAM_ID: 9UR77TD484
      EXPORT_DESTINATION: ${{ inputs.export_only && 'export' || 'upload' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail

          XCODE_APP="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -print -quit)"
          if [[ -n "$XCODE_APP" ]]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi

          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iphoneos SDK: $SDK_VERSION"

          SDK_MAJOR="${SDK_VERSION%%.*}"
          if (( SDK_MAJOR < 26 )); then
            echo "::error::App Store Connect requires the iOS 26 SDK for iOS uploads. This runner has iphoneos $SDK_VERSION."
            exit 1
          fi

      - name: Configure release paths
        run: |
          set -euo pipefail

          echo "ARCHIVE_PATH=$RUNNER_TEMP/HealthSync.xcarchive" >> "$GITHUB_ENV"
          echo "ASC_KEY_DIR=$RUNNER_TEMP/private_keys" >> "$GITHUB_ENV"
          echo "DERIVED_DATA_PATH=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          echo "EXPORT_PATH=$RUNNER_TEMP/HealthSync-export" >> "$GITHUB_ENV"

      - name: Run iOS regression suite
        run: |
          set -euo pipefail

          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          xcodebuild test \
            -project HealthSync.xcodeproj \
            -scheme HealthSync \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/HealthSync-tests.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create export options
        run: |
          set -euo pipefail

          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :destination string $EXPORT_DESTINATION" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          : "${APP_STORE_CONNECT_API_KEY_ID:?Set TESTFLIGHT_APP_STORE_CONNECT_API_KEY_ID in testflight-release}"
          : "${APP_STORE_CONNECT_API_PRIVATE_KEY:?Set TESTFLIGHT_APP_STORE_CONNECT_API_PRIVATE_KEY in testflight-release}"
          umask 077
          mkdir -p "$ASC_KEY_DIR"
          ASC_KEY_PATH="$ASC_KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$ASC_KEY_PATH"
          perl -0pi -e 's/\\n/\n/g' "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive HealthSync
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          : "${APP_STORE_CONNECT_API_ISSUER_ID:?Set TESTFLIGHT_APP_STORE_CONNECT_API_ISSUER_ID in testflight-release}"
          xcodebuild archive \
            -project HealthSync.xcodeproj \
            -scheme HealthSync \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export signed build
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.TESTFLIGHT_APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Remove App Store Connect API key
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/private_keys"

      - name: Collect distribution logs
        if: always()
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/distribution-logs"
          find "$RUNNER_TEMP" -name '*.xcdistributionlogs' -print0 | while IFS= read -r -d '' log; do
            cp -R "$log" "$RUNNER_TEMP/distribution-logs/"
          done

      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-diagnostics
          path: |
            ${{ runner.temp }}/HealthSync-tests.xcresult
            ${{ runner.temp }}/ExportOptions.plist
            ${{ runner.temp }}/HealthSync-export
            ${{ runner.temp }}/distribution-logs
          if-no-files-found: ignore
